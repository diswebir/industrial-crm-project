name: Build cPanel packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, openssl, fileinfo, curl, tokenizer, xml, pdo_mysql, gd, intl, zip, ctype, json
          coverage: none

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --no-check-publish

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build cPanel packages (public + private + combined)
        env:
          CPANEL_COMBINED: "1"
        run: bash deploy/cpanel/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-packages
          path: cpanel-release/*.zip

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cpanel-release/*.zip
